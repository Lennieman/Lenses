<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1814;
    --paper: #f5f0e8;
    --paper-dark: #ede8dc;
    --paper-darker: #e0d9cc;
    --accent: #c0392b;
    --accent-soft: #e8d5d2;
    --gold: #a07840;
    --muted: #7a7060;
    --border: #c8bfaa;
    --card-bg: #faf7f2;
    --shadow: rgba(26,24,20,0.12);
    --tag-bg: #e8e0d0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
  }

  /* ── LAYOUT ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow-y: auto;
    z-index: 10;
  }

  #sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  #sidebar-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    color: var(--paper);
  }

  #sidebar-header p {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .sidebar-section {
    padding: 16px 20px 8px;
  }

  .sidebar-section-label {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
  }

  .sidebar-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13.5px;
    color: rgba(255,255,255,0.7);
    transition: all 0.15s;
    margin-bottom: 2px;
  }

  .sidebar-nav-item:hover { background: rgba(255,255,255,0.07); color: var(--paper); }
  .sidebar-nav-item.active { background: var(--accent); color: white; }
  .sidebar-nav-item .nav-icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-nav-item .nav-count {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
  }

  #sidebar-categories {
    padding: 0 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .cat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    color: rgba(255,255,255,0.6);
    transition: all 0.15s;
  }

  .cat-item:hover { background: rgba(255,255,255,0.07); color: var(--paper); }
  .cat-item.active { background: rgba(255,255,255,0.12); color: white; }

  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #add-category-btn {
    margin: 8px 20px;
    padding: 6px 10px;
    background: transparent;
    border: 1px dashed rgba(255,255,255,0.2);
    border-radius: 6px;
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    text-align: left;
  }

  #add-category-btn:hover { border-color: rgba(255,255,255,0.4); color: rgba(255,255,255,0.6); }

  #sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .sidebar-new-btn {
    width: 100%;
    padding: 10px 14px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
    text-align: center;
    margin-bottom: 4px;
  }

  .sidebar-new-btn:hover { background: #a93226; }

  .sidebar-footer-btn {
    padding: 7px 10px;
    background: rgba(255,255,255,0.06);
    border: none;
    border-radius: 6px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-footer-btn:hover { background: rgba(255,255,255,0.12); color: white; }

  /* MAIN */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOPBAR */
  #topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 28px;
    background: var(--paper);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #topbar h2 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 400;
    flex: 1;
  }

  #search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 14px;
    width: 260px;
  }

  #search-box input {
    border: none;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    width: 100%;
  }

  #search-box input::placeholder { color: var(--muted); }

  .sort-select {
    border: 1px solid var(--border);
    background: var(--paper-dark);
    border-radius: 8px;
    padding: 7px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }

  .view-toggle {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .view-btn {
    padding: 7px 12px;
    background: var(--paper-dark);
    border: none;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    transition: all 0.15s;
    border-right: 1px solid var(--border);
  }

  .view-btn:last-child { border-right: none; }
  .view-btn.active { background: var(--ink); color: var(--paper); }

  #new-piece-btn {
    padding: 8px 18px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  #new-piece-btn:hover { background: #a93226; }

  /* CONTENT AREA */
  #content-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  /* GRID VIEW */
  #pieces-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  /* LIST VIEW */
  #pieces-grid.list-view {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  /* PIECE CARD */
  .piece-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .piece-card:hover {
    border-color: var(--gold);
    box-shadow: 0 4px 16px var(--shadow);
    transform: translateY(-1px);
  }

  .piece-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .piece-card:hover::before { opacity: 1; }

  .card-type-badge {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .card-excerpt {
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag-pill {
    font-size: 10px;
    padding: 2px 8px;
    background: var(--tag-bg);
    border-radius: 20px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .card-date {
    margin-left: auto;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--border);
  }

  /* LIST MODE CARD */
  .list-view .piece-card {
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .list-view .card-left {
    flex-shrink: 0;
    width: 40px;
    text-align: center;
    font-size: 20px;
  }

  .list-view .card-main { flex: 1; min-width: 0; }

  .list-view .card-title {
    font-size: 14px;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .list-view .card-excerpt {
    -webkit-line-clamp: 1;
    font-size: 12px;
  }

  .list-view .card-meta { margin-top: 4px; }

  .list-view .card-type-badge { margin-bottom: 0; }

  /* EMPTY STATE */
  #empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  #empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  #empty-state h3 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ink); margin-bottom: 8px; }
  #empty-state p { font-size: 14px; line-height: 1.6; max-width: 320px; margin: 0 auto 24px; }

  #empty-state button {
    padding: 10px 24px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }

  /* ── MODALS ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,24,20,0.6);
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 20px;
    overflow-y: auto;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--paper);
    border-radius: 14px;
    width: 100%;
    max-width: 720px;
    box-shadow: 0 20px 60px rgba(26,24,20,0.3);
    position: relative;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    padding: 24px 28px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .modal-header h3 {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    flex: 1;
  }

  .modal-close {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    background: var(--paper-dark);
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    color: var(--muted);
    transition: all 0.15s;
  }

  .modal-close:hover { background: var(--ink); color: white; }

  .modal-body { padding: 24px 28px; }
  .modal-footer {
    padding: 16px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: flex-end;
  }

  /* FORM ELEMENTS */
  .form-row { margin-bottom: 18px; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }

  label {
    display: block;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--gold);
  }

  textarea { resize: vertical; min-height: 160px; line-height: 1.6; }

  .btn {
    padding: 9px 20px;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover { background: #2d2a24; }
  .btn-danger { background: var(--accent); color: white; }
  .btn-danger:hover { background: #a93226; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--ink); color: var(--ink); }

  /* TYPE SELECTOR */
  .type-selector {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }

  .type-option {
    padding: 10px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--card-bg);
  }

  .type-option:hover { border-color: var(--gold); }
  .type-option.selected { border-color: var(--accent); background: var(--accent-soft); }
  .type-option .type-icon { font-size: 18px; margin-bottom: 4px; }
  .type-option .type-label { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  /* TAGS INPUT */
  .tags-input-container {
    min-height: 42px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    cursor: text;
    transition: border-color 0.15s;
  }

  .tags-input-container:focus-within { border-color: var(--gold); }

  .tag-item {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--tag-bg);
    border-radius: 20px;
    padding: 2px 8px 2px 10px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--ink);
  }

  .tag-remove {
    width: 14px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    background: var(--muted);
    border-radius: 50%;
    color: white;
    font-size: 9px;
    cursor: pointer;
    border: none;
    flex-shrink: 0;
    line-height: 1;
  }

  .tag-remove:hover { background: var(--accent); }

  .tags-input {
    border: none;
    background: transparent;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink);
    min-width: 100px;
    flex: 1;
    padding: 2px 4px;
  }

  /* RELATIONS */
  .relations-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
  }

  .relation-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--paper-dark);
    border-radius: 8px;
    font-size: 13px;
  }

  .relation-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--border);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .relation-title { flex: 1; font-size: 13px; }

  .relation-remove {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    transition: color 0.15s;
  }

  .relation-remove:hover { color: var(--accent); }

  /* COMMENTS */
  .comments-section { margin-top: 24px; }

  .comment-item {
    padding: 12px 14px;
    background: var(--paper-dark);
    border-left: 3px solid var(--gold);
    border-radius: 0 8px 8px 0;
    margin-bottom: 10px;
    position: relative;
  }

  .comment-meta {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .comment-text { font-size: 13.5px; line-height: 1.6; }

  .comment-delete {
    position: absolute;
    top: 8px; right: 10px;
    border: none;
    background: transparent;
    color: var(--border);
    cursor: pointer;
    font-size: 14px;
    transition: color 0.15s;
  }

  .comment-delete:hover { color: var(--accent); }

  .add-comment-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .add-comment-row input {
    flex: 1;
  }

  /* DETAIL VIEW */
  #detail-view {
    position: fixed;
    inset: 0;
    background: var(--paper);
    z-index: 50;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #detail-topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #detail-back {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  #detail-back:hover { background: var(--ink); color: white; border-color: var(--ink); }

  #detail-actions { margin-left: auto; display: flex; gap: 8px; }

  #detail-content {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  #detail-content .detail-type {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #detail-content h1 {
    font-family: 'Playfair Display', serif;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.25;
    margin-bottom: 16px;
  }

  .detail-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .detail-divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  .detail-body {
    font-size: 16px;
    line-height: 1.8;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .detail-section-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .detail-relations {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .detail-relation-card {
    padding: 12px 16px;
    background: var(--paper-dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail-relation-card:hover { border-color: var(--gold); }

  .detail-relation-icon { font-size: 18px; }
  .detail-relation-info { flex: 1; }
  .detail-relation-rel { font-size: 10px; font-family: 'DM Mono', monospace; color: var(--muted); }
  .detail-relation-title { font-size: 14px; font-weight: 500; }

  /* CATEGORY MODAL */
  .cat-color-picker {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .color-dot {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.15s;
    flex-shrink: 0;
  }

  .color-dot.selected { border-color: var(--ink); }

  /* SEARCH SUGGESTIONS */
  .search-suggest-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 200;
    overflow: hidden;
    margin-top: 4px;
  }

  .suggest-item {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.1s;
  }

  .suggest-item:hover { background: var(--paper-dark); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* CATEGORY COLOR STRIP */
  .cat-strip {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    border-radius: 10px 0 0 10px;
  }

  .piece-card { padding-left: 22px; }

  /* IMAGE PREVIEW - clickable */
  .image-preview {
    max-width: 100%;
    border-radius: 8px;
    margin: 16px 0;
    border: 1px solid var(--border);
    cursor: zoom-in;
    transition: opacity 0.15s;
    display: block;
  }

  .image-preview:hover { opacity: 0.92; }

  /* FULLSCREEN LIGHTBOX */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10, 9, 8, 0.94);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    animation: fadeIn 0.18s ease;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  #lightbox img {
    max-width: 92vw;
    max-height: 90vh;
    border-radius: 6px;
    object-fit: contain;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  #lightbox-close {
    position: fixed;
    top: 20px; right: 24px;
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.12);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    z-index: 301;
  }

  #lightbox-close:hover { background: rgba(255,255,255,0.22); }

  /* BACK-RELATIONS (shown on connected piece) */
  .back-relation-badge {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    font-style: italic;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--gold);
    font-size: 13px;
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.15s;
  }

  .source-link:hover { border-color: var(--gold); }

  /* IMAGE DROP ZONE */
  #image-drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--card-bg);
  }

  #image-drop-zone:hover, #image-drop-zone.drag-over {
    border-color: var(--gold);
    background: var(--paper-dark);
  }

  #image-drop-zone.drag-over #image-drop-inner {
    opacity: 0.6;
    transform: scale(0.97);
  }

  #image-drop-inner { transition: all 0.2s; }
</style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Library</h1>
      <p id="piece-count-label">0 pieces</p>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Browse</div>
      <div class="sidebar-nav-item active" data-filter="all" onclick="setFilter('all', this)">
        <span class="nav-icon">📚</span> All pieces
        <span class="nav-count" id="count-all">0</span>
      </div>
      <div class="sidebar-nav-item" data-filter="article" onclick="setFilter('article', this)">
        <span class="nav-icon">📄</span> Articles
        <span class="nav-count" id="count-article">0</span>
      </div>
      <div class="sidebar-nav-item" data-filter="note" onclick="setFilter('note', this)">
        <span class="nav-icon">✏️</span> Notes
        <span class="nav-count" id="count-note">0</span>
      </div>
      <div class="sidebar-nav-item" data-filter="image" onclick="setFilter('image', this)">
        <span class="nav-icon">🖼️</span> Images
        <span class="nav-count" id="count-image">0</span>
      </div>
      <div class="sidebar-nav-item" data-filter="reference" onclick="setFilter('reference', this)">
        <span class="nav-icon">🔗</span> References
        <span class="nav-count" id="count-reference">0</span>
      </div>
      <div class="sidebar-nav-item" data-filter="idea" onclick="setFilter('idea', this)">
        <span class="nav-icon">💡</span> Ideas
        <span class="nav-count" id="count-idea">0</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Categories</div>
    </div>
    <div id="sidebar-categories"></div>
    <button id="add-category-btn" onclick="openCategoryModal()">+ New category</button>

    <div id="sidebar-footer">
      <button class="sidebar-new-btn" onclick="openEditorModal()">+ New piece</button>
      <button class="sidebar-footer-btn" onclick="exportData()">⬇ Export JSON</button>
      <button class="sidebar-footer-btn" onclick="importData()">⬆ Import JSON</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <h2 id="topbar-title">All pieces</h2>
      <div id="search-box" style="position:relative">
        <span>🔍</span>
        <input type="text" id="search-input" placeholder="Search titles, content, tags…" oninput="onSearch(this.value)">
      </div>
      <select class="sort-select" id="sort-select" onchange="renderPieces()">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="title-asc">A → Z</option>
        <option value="title-desc">Z → A</option>
        <option value="type">By type</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" id="btn-grid" onclick="setView('grid')" title="Grid view">⊞</button>
        <button class="view-btn" id="btn-list" onclick="setView('list')" title="List view">☰</button>
      </div>
      <button id="new-piece-btn" onclick="openEditorModal()">+ New piece</button>
    </div>

    <div id="content-area">
      <div id="pieces-grid"></div>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" style="display:none" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>
<div id="detail-view" style="display:none">
  <div id="detail-topbar">
    <button id="detail-back" onclick="closeDetail()">← Back</button>
    <span id="detail-breadcrumb" style="font-size:13px;color:var(--muted)"></span>
    <div id="detail-actions">
      <button class="btn btn-ghost" onclick="editCurrentPiece()">✏️ Edit</button>
      <button class="btn btn-danger" onclick="deleteCurrentPiece()">🗑 Delete</button>
    </div>
  </div>
  <div id="detail-content"></div>
</div>

<!-- EDITOR MODAL -->
<div id="editor-modal" class="modal-overlay" style="display:none" onclick="modalOverlayClick(event,'editor-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="editor-modal-title">New piece</h3>
      <button class="modal-close" onclick="closeEditorModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- TYPE -->
      <div class="form-row">
        <label>Type</label>
        <div class="type-selector">
          <div class="type-option selected" data-type="article" onclick="selectType('article')">
            <div class="type-icon">📄</div>
            <div class="type-label">Article</div>
          </div>
          <div class="type-option" data-type="note" onclick="selectType('note')">
            <div class="type-icon">✏️</div>
            <div class="type-label">Note</div>
          </div>
          <div class="type-option" data-type="image" onclick="selectType('image')">
            <div class="type-icon">🖼️</div>
            <div class="type-label">Image</div>
          </div>
          <div class="type-option" data-type="reference" onclick="selectType('reference')">
            <div class="type-icon">🔗</div>
            <div class="type-label">Reference</div>
          </div>
          <div class="type-option" data-type="idea" onclick="selectType('idea')">
            <div class="type-icon">💡</div>
            <div class="type-label">Idea</div>
          </div>
        </div>
      </div>

      <!-- TITLE -->
      <div class="form-row">
        <label>Title</label>
        <input type="text" id="editor-title" placeholder="Give this piece a title…">
      </div>

      <!-- CATEGORY + DATE -->
      <div class="form-row-2">
        <div>
          <label>Category</label>
          <select id="editor-category">
            <option value="">— none —</option>
          </select>
        </div>
        <div>
          <label>Source / URL</label>
          <input type="text" id="editor-source" placeholder="https://…">
        </div>
      </div>

      <!-- CONTENT -->
      <div class="form-row">
        <label>Content</label>
        <textarea id="editor-content" placeholder="Write your content here…"></textarea>
      </div>

      <!-- IMAGE UPLOAD (shown for image type) -->
      <div class="form-row" id="image-url-row" style="display:none">
        <label>Image</label>
        <!-- Drop zone / file picker -->
        <div id="image-drop-zone" onclick="document.getElementById('image-file-input').click()"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="handleImageDrop(event)">
          <div id="image-drop-inner">
            <div style="font-size:28px;margin-bottom:8px">📁</div>
            <div style="font-size:13.5px;font-weight:500;color:var(--ink)">Choose from device or drag & drop</div>
            <div style="font-size:11px;color:var(--muted);margin-top:4px">Photos, iCloud, files — JPG, PNG, GIF, WebP</div>
          </div>
          <input type="file" id="image-file-input" accept="image/*" style="display:none" onchange="handleImageFile(event)">
        </div>
        <!-- Preview -->
        <div id="image-preview-container" style="display:none;margin-top:10px;position:relative">
          <img id="image-preview-img" style="max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--border);display:block">
          <button onclick="clearImage()" title="Remove image"
            style="position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(26,24,20,0.7);border:none;color:white;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">×</button>
        </div>
        <!-- Or paste URL -->
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.08em">or paste URL</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>
        <input type="text" id="editor-image-url" placeholder="https://…" style="margin-top:10px" oninput="handleImageUrlInput(this.value)">
      </div>

      <!-- TAGS -->
      <div class="form-row">
        <label>Tags</label>
        <div class="tags-input-container" id="tags-container" onclick="document.getElementById('tag-input').focus()">
          <input class="tags-input" id="tag-input" placeholder="Add tag, press Enter…" onkeydown="handleTagInput(event)">
        </div>
      </div>

      <!-- RELATIONS -->
      <div class="form-row">
        <label>Related pieces</label>
        <div id="relations-selector">
          <select id="relation-type-select" style="width:auto;display:inline-block;margin-bottom:8px">
            <option value="related">Related to</option>
            <option value="references">References</option>
            <option value="part-of">Part of</option>
            <option value="inspired-by">Inspired by</option>
            <option value="contradicts">Contradicts</option>
          </select>
          <select id="relation-piece-select" style="width:auto;display:inline-block;margin:0 8px 8px">
            <option value="">— pick a piece —</option>
          </select>
          <button type="button" class="btn btn-ghost" style="padding:6px 14px;font-size:12px" onclick="addRelation()">Add</button>
        </div>
        <div class="relations-list" id="relations-list"></div>
      </div>

      <!-- COMMENTS -->
      <div class="form-row">
        <label>Comments / Annotations</label>
        <div id="comments-list"></div>
        <div class="add-comment-row">
          <input type="text" id="new-comment-input" placeholder="Add an inline comment or annotation…">
          <button type="button" class="btn btn-ghost" style="padding:8px 14px;font-size:12px" onclick="addComment()">Add</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditorModal()">Cancel</button>
      <button class="btn btn-primary" onclick="savePiece()">Save piece</button>
    </div>
  </div>
</div>

<!-- CATEGORY MODAL -->
<div id="cat-modal" class="modal-overlay" style="display:none" onclick="modalOverlayClick(event,'cat-modal')">
  <div class="modal" style="max-width:400px" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>New category</h3>
      <button class="modal-close" onclick="closeCategoryModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>Name</label>
        <input type="text" id="cat-name-input" placeholder="e.g. Design, Research, Ideas…">
      </div>
      <div class="form-row">
        <label>Color</label>
        <div class="cat-color-picker" id="cat-color-picker"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCategoryModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory()">Create category</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  DATA STORE
// ═══════════════════════════════════════════

const STORAGE_KEY = 'library_pieces';
const CAT_KEY = 'library_categories';

const CAT_COLORS = [
  '#c0392b','#e67e22','#f1c40f','#27ae60','#16a085',
  '#2980b9','#8e44ad','#2c3e50','#a07840','#7f8c8d',
  '#e91e63','#00bcd4','#4caf50','#ff5722','#9c27b0'
];

let pieces = [];
let categories = [];
let currentFilter = 'all';
let currentCategoryFilter = null;
let currentView = 'grid';
let currentSearchQuery = '';
let editingPieceId = null;
let viewingPieceId = null;

// Editor state
let editorTags = [];
let editorRelations = [];
let editorComments = [];
let editorType = 'article';
let selectedCatColor = CAT_COLORS[0];

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════

function loadData() {
  try {
    pieces = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    categories = JSON.parse(localStorage.getItem(CAT_KEY) || '[]');
  } catch(e) {
    pieces = [];
    categories = [];
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(pieces));
  localStorage.setItem(CAT_KEY, JSON.stringify(categories));
}

// ═══════════════════════════════════════════
//  TYPE / ICON HELPERS
// ═══════════════════════════════════════════

const TYPE_ICONS = {
  article: '📄',
  note: '✏️',
  image: '🖼️',
  reference: '🔗',
  idea: '💡'
};

function typeIcon(t) { return TYPE_ICONS[t] || '📄'; }

// ═══════════════════════════════════════════
//  FILTER & SORT
// ═══════════════════════════════════════════

function setFilter(filter, el) {
  currentFilter = filter;
  currentCategoryFilter = null;
  document.querySelectorAll('.sidebar-nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
  const labels = { all: 'All pieces', article: 'Articles', note: 'Notes', image: 'Images', reference: 'References', idea: 'Ideas' };
  document.getElementById('topbar-title').textContent = labels[filter] || filter;
  renderPieces();
}

function setCatFilter(catId) {
  currentCategoryFilter = catId;
  currentFilter = 'all';
  document.querySelectorAll('.sidebar-nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.cat-item').forEach(c => {
    c.classList.toggle('active', c.dataset.catId === catId);
  });
  const cat = categories.find(c => c.id === catId);
  document.getElementById('topbar-title').textContent = cat ? cat.name : '';
  renderPieces();
}

function getFilteredPieces() {
  let list = [...pieces];
  if (currentFilter !== 'all') list = list.filter(p => p.type === currentFilter);
  if (currentCategoryFilter) list = list.filter(p => p.category === currentCategoryFilter);
  if (currentSearchQuery) {
    const q = currentSearchQuery.toLowerCase();
    list = list.filter(p =>
      p.title.toLowerCase().includes(q) ||
      (p.content || '').toLowerCase().includes(q) ||
      (p.tags || []).some(t => t.toLowerCase().includes(q))
    );
  }
  const sort = document.getElementById('sort-select').value;
  if (sort === 'date-desc') list.sort((a,b) => b.createdAt - a.createdAt);
  else if (sort === 'date-asc') list.sort((a,b) => a.createdAt - b.createdAt);
  else if (sort === 'title-asc') list.sort((a,b) => a.title.localeCompare(b.title));
  else if (sort === 'title-desc') list.sort((a,b) => b.title.localeCompare(a.title));
  else if (sort === 'type') list.sort((a,b) => a.type.localeCompare(b.type));
  return list;
}

function onSearch(val) {
  currentSearchQuery = val;
  renderPieces();
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════

function renderSidebar() {
  // Counts
  document.getElementById('count-all').textContent = pieces.length;
  ['article','note','image','reference','idea'].forEach(t => {
    document.getElementById('count-' + t).textContent = pieces.filter(p => p.type === t).length;
  });
  document.getElementById('piece-count-label').textContent = pieces.length + ' piece' + (pieces.length !== 1 ? 's' : '');

  // Categories
  const container = document.getElementById('sidebar-categories');
  container.innerHTML = categories.map(cat => `
    <div class="cat-item" data-cat-id="${cat.id}" onclick="setCatFilter('${cat.id}')">
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span>${cat.name}</span>
      <span style="margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3)">${pieces.filter(p=>p.category===cat.id).length}</span>
    </div>
  `).join('');

  // Category selects in editor
  const catSel = document.getElementById('editor-category');
  const prev = catSel.value;
  catSel.innerHTML = '<option value="">— none —</option>' + categories.map(c =>
    `<option value="${c.id}">${c.name}</option>`
  ).join('');
  catSel.value = prev;
}

function renderPieces() {
  renderSidebar();
  const list = getFilteredPieces();
  const grid = document.getElementById('pieces-grid');

  if (!list.length) {
    grid.innerHTML = `
      <div id="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">${currentSearchQuery ? '🔍' : '📚'}</div>
        <h3>${currentSearchQuery ? 'No results found' : 'Your library is empty'}</h3>
        <p>${currentSearchQuery ? 'Try different search terms or clear the filter.' : 'Start building your knowledge base by adding your first piece.'}</p>
        ${!currentSearchQuery ? '<button onclick="openEditorModal()">Add first piece</button>' : ''}
      </div>`;
    return;
  }

  grid.className = 'pieces-grid' + (currentView === 'list' ? ' list-view' : '');

  if (currentView === 'list') {
    grid.innerHTML = list.map(p => renderListCard(p)).join('');
  } else {
    grid.innerHTML = list.map(p => renderGridCard(p)).join('');
  }
}

function getCatColor(catId) {
  if (!catId) return 'transparent';
  const cat = categories.find(c => c.id === catId);
  return cat ? cat.color : 'transparent';
}

function renderGridCard(p) {
  const excerpt = (p.content || '').replace(/\n/g, ' ').substring(0, 140);
  const date = new Date(p.createdAt).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});
  const tags = (p.tags || []).slice(0,3).map(t => `<span class="tag-pill">${t}</span>`).join('');
  const catColor = getCatColor(p.category);
  return `
    <div class="piece-card" onclick="openDetail('${p.id}')">
      <div class="cat-strip" style="background:${catColor}"></div>
      <div class="card-type-badge">${typeIcon(p.type)} ${p.type}</div>
      <div class="card-title">${escHtml(p.title)}</div>
      ${excerpt ? `<div class="card-excerpt">${escHtml(excerpt)}</div>` : ''}
      <div class="card-meta">
        ${tags}
        <span class="card-date">${date}</span>
      </div>
    </div>`;
}

function renderListCard(p) {
  const excerpt = (p.content || '').replace(/\n/g, ' ').substring(0, 120);
  const date = new Date(p.createdAt).toLocaleDateString('en-GB', {day:'numeric',month:'short'});
  const tags = (p.tags || []).slice(0,2).map(t => `<span class="tag-pill">${t}</span>`).join('');
  const catColor = getCatColor(p.category);
  return `
    <div class="piece-card" onclick="openDetail('${p.id}')">
      <div class="cat-strip" style="background:${catColor}"></div>
      <div class="card-left">${typeIcon(p.type)}</div>
      <div class="card-main">
        <div class="card-title">${escHtml(p.title)}</div>
        ${excerpt ? `<div class="card-excerpt">${escHtml(excerpt)}</div>` : ''}
        <div class="card-meta">${tags}</div>
      </div>
      <div style="flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <span class="card-date">${date}</span>
        ${p.relations?.length ? `<span style="font-size:10px;color:var(--muted)">🔗 ${p.relations.length}</span>` : ''}
        ${p.comments?.length ? `<span style="font-size:10px;color:var(--muted)">💬 ${p.comments.length}</span>` : ''}
      </div>
    </div>`;
}

// ═══════════════════════════════════════════
//  VIEW TOGGLE
// ═══════════════════════════════════════════

function setView(v) {
  currentView = v;
  document.getElementById('btn-grid').classList.toggle('active', v === 'grid');
  document.getElementById('btn-list').classList.toggle('active', v === 'list');
  renderPieces();
}

// ═══════════════════════════════════════════
//  DETAIL VIEW
// ═══════════════════════════════════════════

function openDetail(id) {
  const p = pieces.find(x => x.id === id);
  if (!p) return;
  viewingPieceId = id;

  const cat = p.category ? categories.find(c => c.id === p.category) : null;
  const date = new Date(p.createdAt).toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'});

  let relationsHtml = '';
  // Forward relations (defined on this piece)
  const fwdRelations = p.relations || [];
  // Back-relations (other pieces that reference this one)
  const backRelations = pieces
    .filter(x => x.id !== p.id && (x.relations || []).some(r => r.pieceId === p.id))
    .map(x => ({
      piece: x,
      relationType: x.relations.find(r => r.pieceId === p.id).relationType
    }));

  const allRelations = [
    ...fwdRelations.map(r => ({ pieceId: r.pieceId, relationType: r.relationType, direction: 'forward' })),
    ...backRelations.map(r => ({ pieceId: r.piece.id, relationType: r.relationType, direction: 'back' }))
  ];

  if (allRelations.length) {
    relationsHtml = `
      <div class="detail-divider"></div>
      <div class="detail-section-title">Related pieces</div>
      <div class="detail-relations">
        ${allRelations.map(r => {
          const related = pieces.find(x => x.id === r.pieceId);
          if (!related) return '';
          const dirLabel = r.direction === 'back'
            ? `<span class="back-relation-badge">← referenced as "${r.relationType}"</span>`
            : `<span class="relation-label">${r.relationType}</span>`;
          return `
            <div class="detail-relation-card" onclick="openDetail('${related.id}')">
              <div class="detail-relation-icon">${typeIcon(related.type)}</div>
              <div class="detail-relation-info">
                <div class="detail-relation-rel">${dirLabel}</div>
                <div class="detail-relation-title">${escHtml(related.title)}</div>
              </div>
              <span style="color:var(--muted)">→</span>
            </div>`;
        }).join('')}
      </div>`;
  }

  let commentsHtml = '';
  if (p.comments && p.comments.length) {
    commentsHtml = `
      <div class="detail-divider"></div>
      <div class="detail-section-title">Comments & Annotations</div>
      ${p.comments.map((c,i) => `
        <div class="comment-item">
          <div class="comment-meta">Annotation · ${new Date(c.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</div>
          <div class="comment-text">${escHtml(c.text)}</div>
        </div>
      `).join('')}`;
  }

  let imageHtml = '';
  if (p.type === 'image') {
    const imgSrc = p.imageData || p.imageUrl;
    if (imgSrc) imageHtml = `<img src="${imgSrc}" class="image-preview" alt="${escHtml(p.title)}" onclick="openLightbox(this.src)" onerror="this.style.display='none'" title="Click to view full screen">`;
  }

  let sourceHtml = '';
  if (p.source) {
    sourceHtml = `<a href="${p.source}" target="_blank" class="source-link">🔗 Source</a>`;
  }

  document.getElementById('detail-breadcrumb').textContent = cat ? cat.name : '';
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-type">
      ${typeIcon(p.type)} ${p.type}
      ${cat ? `<span style="display:inline-flex;align-items:center;gap:4px;margin-left:8px"><span style="width:8px;height:8px;border-radius:50%;background:${cat.color};display:inline-block"></span>${cat.name}</span>` : ''}
    </div>
    <h1>${escHtml(p.title)}</h1>
    <div class="detail-meta-row">
      <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)">${date}</span>
      ${(p.tags||[]).map(t=>`<span class="tag-pill">${t}</span>`).join('')}
      ${sourceHtml}
    </div>
    ${imageHtml}
    ${p.content ? `<div class="detail-body">${escHtml(p.content)}</div>` : ''}
    ${relationsHtml}
    ${commentsHtml}
  `;

  document.getElementById('detail-view').style.display = 'flex';
  document.getElementById('detail-view').style.flexDirection = 'column';
}

function closeDetail() {
  document.getElementById('detail-view').style.display = 'none';
  viewingPieceId = null;
}

function editCurrentPiece() {
  if (viewingPieceId) {
    const idToEdit = viewingPieceId;
    closeDetail();
    openEditorModal(idToEdit);
  }
}

function deleteCurrentPiece() {
  if (!viewingPieceId) return;
  const p = pieces.find(x => x.id === viewingPieceId);
  if (!p) return;
  if (!confirm(`Delete "${p.title}"? This cannot be undone.`)) return;
  pieces = pieces.filter(x => x.id !== viewingPieceId);
  // Remove relations pointing to this piece
  pieces.forEach(x => {
    if (x.relations) x.relations = x.relations.filter(r => r.pieceId !== viewingPieceId);
  });
  saveData();
  closeDetail();
  renderPieces();
}

// ═══════════════════════════════════════════
//  EDITOR MODAL
// ═══════════════════════════════════════════

function openEditorModal(id = null) {
  editingPieceId = id;
  editorTags = [];
  editorRelations = [];
  editorComments = [];
  editorType = 'article';

  document.getElementById('editor-modal-title').textContent = id ? 'Edit piece' : 'New piece';
  document.getElementById('editor-title').value = '';
  document.getElementById('editor-content').value = '';
  document.getElementById('editor-source').value = '';
  document.getElementById('image-url-row').style.display = 'none';
  resetImageUI();

  // Populate relations dropdown
  const relSel = document.getElementById('relation-piece-select');
  relSel.innerHTML = '<option value="">— pick a piece —</option>' + pieces
    .filter(p => p.id !== id)
    .map(p => `<option value="${p.id}">${typeIcon(p.type)} ${escHtml(p.title)}</option>`)
    .join('');

  if (id) {
    const p = pieces.find(x => x.id === id);
    if (p) {
      selectType(p.type);
      document.getElementById('editor-title').value = p.title;
      document.getElementById('editor-content').value = p.content || '';
      document.getElementById('editor-source').value = p.source || '';
      document.getElementById('editor-category').value = p.category || '';
      editorTags = [...(p.tags || [])];
      editorRelations = [...(p.relations || [])];
      editorComments = [...(p.comments || [])];
      if (p.type === 'image') {
        document.getElementById('image-url-row').style.display = 'block';
        if (p.imageData) {
          editorImageData = p.imageData;
          showImagePreview(p.imageData);
        } else if (p.imageUrl) {
          document.getElementById('editor-image-url').value = p.imageUrl;
          showImagePreview(p.imageUrl);
        }
      }
    }
  } else {
    selectType('article');
  }

  renderTagsUI();
  renderRelationsUI();
  renderCommentsUI();
  renderSidebar();

  document.getElementById('editor-modal').style.display = 'flex';
  document.getElementById('editor-title').focus();
}

function closeEditorModal() {
  document.getElementById('editor-modal').style.display = 'none';
  editingPieceId = null;
}

function selectType(type) {
  editorType = type;
  document.querySelectorAll('.type-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.type === type);
  });
  document.getElementById('image-url-row').style.display = type === 'image' ? 'block' : 'none';
}

// TAGS
function handleTagInput(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val && !editorTags.includes(val)) {
      editorTags.push(val);
      renderTagsUI();
    }
    e.target.value = '';
  }
}

function removeTag(tag) {
  editorTags = editorTags.filter(t => t !== tag);
  renderTagsUI();
}

function renderTagsUI() {
  const container = document.getElementById('tags-container');
  const input = document.getElementById('tag-input');
  container.innerHTML = '';
  editorTags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag-item';
    span.innerHTML = `${escHtml(tag)} <button class="tag-remove" onclick="removeTag('${escHtml(tag)}')" type="button">×</button>`;
    container.appendChild(span);
  });
  container.appendChild(input);
  input.value = '';
}

// RELATIONS
function addRelation() {
  const type = document.getElementById('relation-type-select').value;
  const pieceId = document.getElementById('relation-piece-select').value;
  if (!pieceId) return;
  if (editorRelations.find(r => r.pieceId === pieceId && r.relationType === type)) return;
  editorRelations.push({ relationType: type, pieceId });
  renderRelationsUI();
}

function removeRelation(pieceId, relationType) {
  editorRelations = editorRelations.filter(r => !(r.pieceId === pieceId && r.relationType === relationType));
  renderRelationsUI();
}

function renderRelationsUI() {
  const list = document.getElementById('relations-list');
  list.innerHTML = editorRelations.map(r => {
    const p = pieces.find(x => x.id === r.pieceId);
    return `
      <div class="relation-item">
        <span class="relation-label">${r.relationType}</span>
        <span class="relation-title">${p ? typeIcon(p.type) + ' ' + escHtml(p.title) : 'Unknown'}</span>
        <button class="relation-remove" onclick="removeRelation('${r.pieceId}','${r.relationType}')" type="button">×</button>
      </div>`;
  }).join('');
}

// COMMENTS
function addComment() {
  const input = document.getElementById('new-comment-input');
  const text = input.value.trim();
  if (!text) return;
  editorComments.push({ text, createdAt: Date.now() });
  input.value = '';
  renderCommentsUI();
}

function removeComment(index) {
  editorComments.splice(index, 1);
  renderCommentsUI();
}

function renderCommentsUI() {
  const list = document.getElementById('comments-list');
  list.innerHTML = editorComments.map((c, i) => `
    <div class="comment-item">
      <button class="comment-delete" onclick="removeComment(${i})" type="button">×</button>
      <div class="comment-meta">Annotation · ${new Date(c.createdAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</div>
      <div class="comment-text">${escHtml(c.text)}</div>
    </div>
  `).join('');
}

// SAVE
function savePiece() {
  const title = document.getElementById('editor-title').value.trim();
  if (!title) { alert('Please add a title.'); return; }

  const now = Date.now();
  const piece = {
    id: editingPieceId || 'p_' + now + '_' + Math.random().toString(36).substr(2,6),
    type: editorType,
    title,
    content: document.getElementById('editor-content').value.trim(),
    source: document.getElementById('editor-source').value.trim(),
    imageData: editorType === 'image' ? (editorImageData || null) : null,
    imageUrl: editorType === 'image' ? (editorImageData ? '' : document.getElementById('editor-image-url').value.trim()) : '',
    category: document.getElementById('editor-category').value || '',
    tags: [...editorTags],
    relations: [...editorRelations],
    comments: [...editorComments],
    createdAt: editingPieceId ? (pieces.find(p => p.id === editingPieceId)?.createdAt || now) : now,
    updatedAt: now
  };

  if (editingPieceId) {
    const idx = pieces.findIndex(p => p.id === editingPieceId);
    if (idx > -1) pieces[idx] = piece;
  } else {
    pieces.unshift(piece);
  }

  saveData();
  closeEditorModal();
  renderPieces();
}

// ═══════════════════════════════════════════
//  CATEGORY MODAL
// ═══════════════════════════════════════════

function openCategoryModal() {
  selectedCatColor = CAT_COLORS[0];
  document.getElementById('cat-name-input').value = '';
  const picker = document.getElementById('cat-color-picker');
  picker.innerHTML = CAT_COLORS.map((c, i) => `
    <div class="color-dot ${i === 0 ? 'selected' : ''}" style="background:${c}" onclick="selectCatColor('${c}', this)"></div>
  `).join('');
  document.getElementById('cat-modal').style.display = 'flex';
  document.getElementById('cat-name-input').focus();
}

function closeCategoryModal() {
  document.getElementById('cat-modal').style.display = 'none';
}

function selectCatColor(color, el) {
  selectedCatColor = color;
  document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
}

function saveCategory() {
  const name = document.getElementById('cat-name-input').value.trim();
  if (!name) { alert('Please enter a category name.'); return; }
  categories.push({ id: 'cat_' + Date.now(), name, color: selectedCatColor });
  saveData();
  closeCategoryModal();
  renderSidebar();
}

// ═══════════════════════════════════════════
//  EXPORT / IMPORT
// ═══════════════════════════════════════════

function exportData() {
  const data = { pieces, categories, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'library_export_' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importData() {
  document.getElementById('import-file').click();
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.pieces)) throw new Error('Invalid format');
      if (confirm(`Import ${data.pieces.length} pieces and ${(data.categories||[]).length} categories? This will merge with existing data.`)) {
        // Merge: add only pieces/cats that don't already exist by ID
        const existingIds = new Set(pieces.map(p => p.id));
        const newPieces = data.pieces.filter(p => !existingIds.has(p.id));
        pieces = [...pieces, ...newPieces];
        const existingCatIds = new Set(categories.map(c => c.id));
        const newCats = (data.categories || []).filter(c => !existingCatIds.has(c.id));
        categories = [...categories, ...newCats];
        saveData();
        renderPieces();
      }
    } catch(err) {
      alert('Import failed: invalid JSON file.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ═══════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════

function escHtml(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function modalOverlayClick(event, modalId) {
  if (event.target.id === modalId) {
    if (modalId === 'editor-modal') closeEditorModal();
    if (modalId === 'cat-modal') closeCategoryModal();
  }
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('lightbox').style.display !== 'none') { closeLightbox(); return; }
    if (document.getElementById('editor-modal').style.display !== 'none') closeEditorModal();
    else if (document.getElementById('cat-modal').style.display !== 'none') closeCategoryModal();
    else if (document.getElementById('detail-view').style.display !== 'none') closeDetail();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
    e.preventDefault();
    openEditorModal();
  }
});

// ═══════════════════════════════════════════
//  LIGHTBOX
// ═══════════════════════════════════════════

function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = src;
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox-img').src = '';
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════
//  IMAGE UPLOAD
// ═══════════════════════════════════════════

let editorImageData = null; // base64 data URI or null

function handleImageFile(event) {
  const file = event.target.files[0];
  if (file) readImageFile(file);
}

function handleImageDrop(event) {
  event.preventDefault();
  document.getElementById('image-drop-zone').classList.remove('drag-over');
  const file = event.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) readImageFile(file);
}

function readImageFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    editorImageData = e.target.result; // base64 data URI
    document.getElementById('editor-image-url').value = '';
    showImagePreview(editorImageData);
  };
  reader.readAsDataURL(file);
}

function handleImageUrlInput(url) {
  if (url) {
    editorImageData = null; // URL takes precedence, clear any uploaded data
    showImagePreview(url);
  } else {
    clearImage();
  }
}

function showImagePreview(src) {
  const img = document.getElementById('image-preview-img');
  img.src = src;
  img.onerror = () => {
    document.getElementById('image-preview-container').style.display = 'none';
  };
  img.onload = () => {
    document.getElementById('image-preview-container').style.display = 'block';
  };
}

function clearImage() {
  editorImageData = null;
  document.getElementById('editor-image-url').value = '';
  document.getElementById('editor-image-file-input') && (document.getElementById('image-file-input').value = '');
  document.getElementById('image-preview-container').style.display = 'none';
  document.getElementById('image-preview-img').src = '';
}

function resetImageUI() {
  editorImageData = null;
  document.getElementById('editor-image-url').value = '';
  document.getElementById('image-file-input').value = '';
  document.getElementById('image-preview-container').style.display = 'none';
  document.getElementById('image-preview-img').src = '';
}

// Bootstrap
loadData();
renderPieces();
</script>
